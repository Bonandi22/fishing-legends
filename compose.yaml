# Development stack: one command brings up Postgres + backend + frontend.
#   docker compose up
# Postgres is also published on localhost:5432 so `npm run test:integration`
# can run against it from the host.

name: deep-blue-lure

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deepbluelure
      POSTGRES_PASSWORD: deepbluelure
      POSTGRES_DB: deepbluelure
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepbluelure -d deepbluelure"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    env_file:
      - .env.docker
    environment:
      HOST: 0.0.0.0
      PORT: "8090"
      DATABASE_URL: postgres://deepbluelure:deepbluelure@postgres:5432/deepbluelure
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # Only source is bind-mounted; node_modules stays as baked into the image.
    volumes:
      - ./backend:/app/backend
      - ./src:/app/src
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.backend.json:/app/tsconfig.backend.json
      - ./drizzle.config.ts:/app/drizzle.config.ts

  email-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    command: npm run backend:email-worker
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgres://deepbluelure:deepbluelure@postgres:5432/deepbluelure
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./src:/app/src
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.backend.json:/app/tsconfig.backend.json

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    environment:
      # API base for the client to reach the backend from the browser
      VITE_API_BASE_URL: http://backend:8090
    ports:
      - "8080:8080"
    depends_on:
      - backend
    volumes:
      - ./:/app
      - frontend_node_modules:/app/node_modules

volumes:
  pgdata:
  frontend_node_modules:
