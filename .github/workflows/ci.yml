name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'feature/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: TypeScript, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript (frontend)
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: TypeScript (backend)
        run: npm run backend:typecheck

      - name: Unit tests
        run: npm test -- --run

      - name: Production build
        run: npm run build

  audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Advisory only: known transitive vulns are tracked separately (see
      # CLAUDE.md). The step never fails the check — it writes the report to the
      # job summary so a new advisory is visible without blocking the merge.
      - name: npm audit (high and critical)
        run: |
          echo '## npm audit (high+critical)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm audit --audit-level=high >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: Backend integration (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: deepbluelure
          POSTGRES_PASSWORD: deepbluelure
          POSTGRES_DB: deepbluelure
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deepbluelure -d deepbluelure"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

      mailpit:
        image: axllent/mailpit:v1.21
        ports:
          - 1025:1025
          - 8025:8025

    env:
      DATABASE_URL: postgres://deepbluelure:deepbluelure@localhost:5432/deepbluelure
      RABBITMQ_URL: amqp://guest:guest@localhost:5672
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      MAILPIT_URL: http://localhost:8025
      AUTH_CODE_SECRET: ci-only-auth-code-secret-not-a-real-secret-0123

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run backend:db:migrate

      - name: Integration tests
        run: npm run test:integration
