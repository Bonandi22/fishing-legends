name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'feature/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: TypeScript, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript (frontend)
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: TypeScript (backend)
        run: npm run backend:typecheck

      - name: Unit tests
        run: npm test -- --run

      - name: Production build
        run: npm run build

  audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory only: known transitive vulns are tracked separately (see CLAUDE.md).
    # This surfaces new advisories in the PR checks without blocking the merge.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high and critical)
        run: npm audit --audit-level=high

  integration:
    name: Backend integration (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: deepbluelure
          POSTGRES_PASSWORD: deepbluelure
          POSTGRES_DB: deepbluelure
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deepbluelure -d deepbluelure"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://deepbluelure:deepbluelure@localhost:5432/deepbluelure

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run backend:db:migrate

      - name: Integration tests
        run: npm run test:integration
