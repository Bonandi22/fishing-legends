server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API is proxied same-origin so auth cookies are first-party to the SPA
  location /api/ {
    proxy_pass http://backend:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA: unknown paths fall back to index.html
  location / {
    try_files $uri $uri/ /index.html;

    # Security headers for the app document. The backend sets its own headers
    # on /api responses; these cover the static SPA that nginx serves.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # style-src needs 'unsafe-inline' (Tailwind/runtime style injection) and the
    # Google Fonts stylesheet host (src/index.css @imports it; font files come
    # from fonts.gstatic.com). The Vite production build emits no inline scripts,
    # so script-src stays strict. TODO: self-host the fonts to drop both hosts.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; connect-src 'self'; worker-src 'self' blob:; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  }

  # Hashed assets are safe to cache aggressively
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
